<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="拾词">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f0f0ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>拾词</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400..900;1,400..700&family=Caveat:wght@500;600&display=swap">
<style>
/* 布局：灰白网格纸背景 + 缓慢漂移的柔光；像贴纸一样的浅灰卡片，底部三个标签页。深色模式下背景变黑，卡片保持浅色贴纸感 */
:root{
  --page:#efefee; --grid:rgba(0,0,0,.045); --glow:rgba(255,255,255,.95); --glow2:rgba(225,225,225,.9);
  --page-text:#2b2b2c; --page-sub:#8b8b8d;
  --card:#fafafa; --card-2:#f1f1f1; --line:rgba(0,0,0,.07); --well-a:#eeeeee; --well-b:#dadada;
  --text:#2e2e30; --sub:#8c8c8e; --faint:#bdbdbf; --icon:#8f8f91;
  --ink:#3b3b3d; --ink-text:#ffffff; --mark:#dededf; --warn:#b5626a;
  --shadow:0 0 0 1px var(--line),0 1px 0 rgba(255,255,255,.9) inset,0 10px 24px rgba(0,0,0,.055);
  --shadow-press:0 0 0 1px var(--line),0 1px 0 rgba(255,255,255,.9) inset,0 3px 8px rgba(0,0,0,.05);
  --scrim:rgba(230,230,230,.45); --page-on:#3b3b3d; --page-on-text:#ffffff;
  --round:"Nunito",-apple-system,"PingFang SC","Hiragino Sans GB","Helvetica Neue",system-ui,sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.3,1.35,.55,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:var(--round); color:var(--text); -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#151516; --grid:rgba(255,255,255,.065); --glow:rgba(255,255,255,.07); --glow2:rgba(255,255,255,.045);
    --page-text:#f1f1f1; --page-sub:#8f8f92; --scrim:rgba(0,0,0,.45); --page-on:#f1f1f1; --page-on-text:#1d1d1f;
  }
}
:root[data-theme="dark"]{
  --page:#151516; --grid:rgba(255,255,255,.065); --glow:rgba(255,255,255,.07); --glow2:rgba(255,255,255,.045);
  --page-text:#f1f1f1; --page-sub:#8f8f92; --scrim:rgba(0,0,0,.45); --page-on:#f1f1f1; --page-on-text:#1d1d1f;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--page)}
body{margin:0;height:100%;overflow:hidden;background:var(--page);color:var(--text)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #9c9ca0;outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}

/* ---------- 背景：网格纸 + 漂移柔光 ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.grid-paper{position:absolute;inset:-60px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;animation:pan 60s linear infinite}
@keyframes pan{to{transform:translate3d(24px,48px,0)}}
.glow{position:absolute;border-radius:50%;will-change:transform;--p:0}
.g1{width:90vmax;height:90vmax;left:-40vmax;top:-35vmax;background:radial-gradient(circle,var(--glow) 0%,transparent 60%);animation:g1 26s ease-in-out infinite alternate}
.g2{width:80vmax;height:80vmax;right:-40vmax;top:20%;background:radial-gradient(circle,var(--glow2) 0%,transparent 60%);animation:g2 32s ease-in-out infinite alternate}
.g3{width:70vmax;height:70vmax;left:-10vmax;bottom:-40vmax;background:radial-gradient(circle,var(--glow) 0%,transparent 60%);animation:g3 38s ease-in-out infinite alternate}
@keyframes g1{to{transform:translate3d(30vw,25vh,0) scale(1.15)}}
@keyframes g2{to{transform:translate3d(-35vw,-10vh,0) scale(.9)}}
@keyframes g3{to{transform:translate3d(25vw,-30vh,0) scale(1.2)}}
.shift{position:absolute;inset:0;transition:transform 1.6s cubic-bezier(.45,0,.2,1);transform:translateX(calc(var(--tab,0) * -6vw))}

/* ---------- 通用 ---------- */
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);color:var(--text)}
.press{transition:transform .36s var(--spring),box-shadow .36s var(--ease)}
.press:active{transform:scale(.97);box-shadow:var(--shadow-press);transition-duration:.12s}
.well{display:grid;place-items:center;border-radius:50%;background:linear-gradient(150deg,var(--well-a),var(--well-b));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.9),inset 0 -2px 4px rgba(0,0,0,.04),0 2px 5px rgba(0,0,0,.06);color:var(--icon)}
.round-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);color:var(--text);flex:none}
.round-btn svg{width:20px;height:20px}
.round-btn.dark{background:var(--page-on);color:var(--page-on-text)}
.page .chip.on{background:var(--page-on);color:var(--page-on-text)}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:700;color:var(--text)}
.pill svg{width:15px;height:15px}
.hand{font-family:var(--hand);font-weight:500}
.chip{flex:none;height:34px;padding:0 15px;border-radius:17px;font-size:13px;font-weight:700;background:var(--card);color:var(--sub);
  box-shadow:0 0 0 1px var(--line);transition:background .25s,color .25s,transform .32s var(--spring)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:var(--ink-text);box-shadow:none}
.chip.dashed{background:transparent;color:var(--page-sub);box-shadow:inset 0 0 0 1.5px var(--page-sub);box-shadow:none;border:1.5px dashed var(--page-sub)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 6px;margin:0 -20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;padding:3px;border-radius:14px;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line);position:relative}
.seg button{position:relative;z-index:1;font-size:12px;font-weight:700;color:var(--sub);padding:6px 12px;border-radius:11px;transition:color .25s;flex:1;text-align:center}
.seg button.on{color:var(--text)}
.seg .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:11px;background:var(--card);
  box-shadow:0 1px 3px rgba(0,0,0,.08),0 0 0 1px var(--line);transform:translateX(calc(var(--k,0)*100%));transition:transform .4s var(--ease)}

/* ---------- 页面 ---------- */
#app{position:relative;z-index:1;height:100%}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 120px);display:none;
  transition:opacity .36s var(--ease),transform .36s var(--ease),filter .36s var(--ease);scrollbar-width:none;color:var(--page-text)}
.page::-webkit-scrollbar{display:none}
.page.show{display:block}
.page.in{opacity:0;transform:translateY(14px);filter:blur(6px)}
.page.out{opacity:0;transform:scale(.98);filter:blur(4px);pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.h-title{margin:0;font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.15;color:var(--page-text)}
.h-sub{font-size:13px;color:var(--page-sub);margin-top:4px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px;font-size:14px;font-weight:800;color:var(--page-text)}
.sec span{font-size:12px;font-weight:600;color:var(--page-sub)}

/* 首页：吉祥物 */
.mascot{position:relative;width:200px;height:190px;margin:4px auto 0}
.mascot .blob{position:absolute;inset:6px 0 0;border-radius:46% 54% 52% 48% / 55% 48% 52% 45%;background:radial-gradient(circle at 40% 35%,var(--card),var(--card-2));
  box-shadow:var(--shadow);animation:morph 9s ease-in-out infinite alternate}
@keyframes morph{to{border-radius:55% 45% 46% 54% / 46% 56% 44% 54%}}
.mascot svg.cat{position:absolute;left:14px;top:2px;width:172px;height:189px;animation:bob 3.6s ease-in-out infinite;overflow:visible}
.steam path{opacity:0;animation:steam 3.4s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:1.1s}
.steam path:nth-child(3){animation-delay:2.2s}
@keyframes steam{0%{opacity:0;transform:translateY(12px)}35%{opacity:.95}100%{opacity:0;transform:translateY(-16px)}}
@keyframes bob{50%{transform:translateY(-5px)}}
.mascot .eyes{transform-origin:100px 136px;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.bubble{position:absolute;right:-6px;top:4px;width:48px;height:48px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--icon);
  animation:float 4.2s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:4px;bottom:2px;width:12px;height:12px;background:var(--card);border-radius:0 0 0 12px;transform:rotate(10deg);box-shadow:-1px 1px 0 var(--line)}
.bubble svg{width:22px;height:22px;fill:currentColor;stroke:none}
@keyframes float{50%{transform:translate(2px,-6px) rotate(4deg)}}
.greet{text-align:center;margin-top:12px}
.greet h2{margin:0;font-size:24px;font-weight:800;color:var(--page-text)}
.greet p{margin:4px 0 0;font-size:22px;color:var(--page-sub)}

.quick{padding:16px;margin-top:18px}
.quick-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;margin-bottom:12px}
.quick-head span{font-size:12px;font-weight:600;color:var(--sub)}
.msg{display:flex;align-items:center;gap:8px;height:50px;padding:0 6px 0 18px;border-radius:25px;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line)}
.msg input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;font-weight:600}
.msg input::placeholder{color:var(--faint);font-weight:500}
.send{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--ink-text);transition:transform .3s var(--spring),opacity .2s}
.send:disabled{opacity:.3}
.send:active{transform:scale(.9)}
.send svg{width:17px;height:17px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 6px 14px;text-align:center}
.tile svg{width:26px;height:26px;color:var(--icon);margin-bottom:4px}
.tile b{font-size:14px;font-weight:800}
.tile small{font-size:11px;color:var(--sub)}

.stickers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;align-items:start}
.note{position:relative;padding:28px 16px 16px;text-align:center;transform:rotate(-1.5deg);margin-top:10px}
.note .clip{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:36px;height:24px;color:var(--faint)}
.note .lab{font-family:var(--hand);font-size:19px;color:var(--sub)}
.note .nw{font-size:24px;font-weight:800;margin:6px 0 2px;word-break:break-word;line-height:1.15}
.note .nm{font-size:13px;color:var(--sub);min-height:36px;display:flex;align-items:center;justify-content:center;transition:opacity .3s,filter .3s}
.note .nm.blur{filter:blur(5px);opacity:.6}
.note .lines{height:3px;border-radius:2px;background:var(--card-2);margin-top:8px;box-shadow:0 6px 0 var(--card-2)}
.ring-card{padding:16px;text-align:center;transform:rotate(1.2deg)}
.ring-card .lab{font-size:12px;font-weight:700;color:var(--sub)}
.ring{position:relative;width:96px;height:96px;margin:8px auto 4px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .t{stroke:var(--card-2)}
.ring .p{stroke:#a8a8aa;transition:stroke-dasharray 1.1s var(--ease)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;font-weight:900;line-height:1}
.ring .n small{font-size:11px;font-weight:700;color:var(--sub);margin-top:2px}
.week{display:flex;justify-content:center;gap:5px;margin-top:8px}
.week i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--faint);display:grid;place-items:center;font-style:normal;font-size:8px;color:transparent}
.week i.on{background:#9a9a9c;box-shadow:none;color:#fff}
.week i.today{box-shadow:inset 0 0 0 1.5px var(--text)}
.ring-card .hand{display:block;font-size:17px;color:var(--sub);margin-top:6px;line-height:1.1}

.recent{padding:6px 0;overflow:hidden}
.r-row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;text-align:left;transition:background .2s}
.r-row:active{background:var(--card-2)}
.r-row + .r-row{border-top:1px solid var(--line)}
.r-row .well{width:38px;height:38px;font-size:15px;font-weight:900}
.r-main{flex:1;min-width:0}
.r-main b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-main small{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-row svg{width:16px;height:16px;color:var(--faint)}

/* 书架 */
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:23px;margin:12px 0 4px}
.search svg{width:18px;height:18px;color:var(--icon)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;font-weight:600}
.search input::placeholder{color:var(--faint);font-weight:500}
.book-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 2px 12px;min-height:34px}
.book-bar .info{font-size:13px;font-weight:700;color:var(--page-sub);display:flex;align-items:center;gap:6px}
.book-bar .edit{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--page-sub)}
.book-bar .edit svg{width:16px;height:16px}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;padding:16px 16px 14px;text-align:left;min-width:0}
.wgrid.stagger .wcard{animation:pop .5s var(--ease) both;animation-delay:calc(var(--n,0)*35ms)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}}
.wcard .well{width:62px;height:62px;font-size:26px;font-weight:900;margin-bottom:14px;text-transform:lowercase}
.wcard b{font-size:17px;font-weight:800;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard small{font-size:12px;color:var(--sub);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.wcard .mark{position:absolute;right:12px;top:12px;width:30px;height:30px;display:grid;place-items:center;color:var(--faint);transition:transform .35s var(--spring),color .2s}
.wcard .mark svg{width:18px;height:18px}
.wcard .mark.on{color:var(--text)}
.wcard .mark.on svg{fill:currentColor}
.wcard .mark:active{transform:scale(.8)}
.empty{text-align:center;padding:40px 20px 0;color:var(--page-sub);font-size:14px;line-height:1.7}
.empty .hand{display:block;font-size:30px;color:var(--page-text);margin-bottom:4px}

/* 打印页 */
.pv-opts{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 2px 14px;flex-wrap:wrap}
.pv-opts .info{font-size:13px;font-weight:700;color:var(--page-sub)}
.pv-pages{display:flex;flex-direction:column;align-items:center;gap:16px}
.pv-holder{position:relative;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 12px 30px rgba(0,0,0,.12);border-radius:4px;overflow:hidden}
.pv-holder .a5{position:absolute;left:0;top:0;transform-origin:0 0}
.print-go{position:fixed;left:20px;right:20px;z-index:9;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transition:opacity .3s,transform .4s var(--ease)}
.print-go.off{opacity:0;transform:translateY(16px);pointer-events:none}

/* A5 纸面 */
.a5{width:148mm;height:210mm;background:#fff;color:#1d1d1f;padding:11mm 10mm 9mm;display:flex;flex-direction:column;font-family:var(--round)}
.a5-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:2.2mm;border-bottom:.3mm solid #1d1d1f;font-size:8pt}
.a5-head b{font-size:11pt;font-weight:800}
.a5-head span{color:#77777a;font-weight:600}
.a5-grid{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:9.6mm;margin-top:1mm}
.a5-cell{display:flex;align-items:center;gap:1.4mm;padding:0 3mm 0 .4mm;border-bottom:.15mm dotted #bdbdc0;min-width:0}
.a5-w{flex:1;min-width:0;font-size:10pt;font-weight:600;white-space:nowrap;overflow:hidden;letter-spacing:-.01em}
.a5-box{flex:none;width:3mm;height:3mm;border:.25mm solid #59595c;border-radius:.6mm}
.a5-foot{margin-top:auto;display:flex;justify-content:space-between;font-size:7pt;color:#8d8d90;padding-top:2mm}
.a5-foot .hand{font-size:10pt;color:#77777a}

/* ---------- 底部标签栏 ---------- */
.tabbar{position:fixed;z-index:10;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);height:68px;border-radius:26px;
  display:flex;padding:7px;background:var(--card);box-shadow:var(--shadow),0 14px 30px rgba(0,0,0,.08);transition:filter .38s var(--ease),transform .4s var(--ease)}
.tabbar .hl{position:absolute;top:7px;bottom:7px;left:7px;width:calc((100% - 14px)/3);border-radius:20px;background:var(--card-2);
  box-shadow:inset 0 0 0 1px var(--line);transform:translateX(calc(var(--t,0)*100%));transition:transform .46s cubic-bezier(.25,1.12,.4,1)}
.tab{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--faint);transition:color .3s}
.tab svg{width:22px;height:22px;transition:transform .4s var(--spring)}
.tab.on{color:var(--text);font-weight:800}
.tab.on svg{transform:translateY(-1px) scale(1.06)}
.tab.on svg .fill{fill:currentColor}

/* ---------- 弹出面板 ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:21;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px + var(--kb,0px));
  padding:14px 22px 22px;border-radius:32px;background:var(--card);box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.18);color:var(--text);
  transform:translateY(calc(100% + 40px)) scale(.97);transform-origin:bottom center;opacity:0;visibility:hidden;
  max-height:calc(100dvh - var(--kb,0px) - env(safe-area-inset-top,0px) - 24px);overflow-y:auto;overscroll-behavior:contain;
  transition:transform .42s var(--ease),opacity .3s var(--ease),visibility 0s linear .42s}
.sheet.on{transform:none;opacity:1;visibility:visible;transition:transform .42s var(--ease),opacity .3s var(--ease),visibility 0s}
.grab{width:38px;height:5px;border-radius:3px;background:var(--faint);opacity:.6;margin:0 auto 12px}
.tape{width:92px;height:24px;margin:-4px auto 10px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 6px,transparent 6px 12px),rgba(214,214,216,.85);
  transform:rotate(-2.5deg);box-shadow:0 1px 2px rgba(0,0,0,.06);clip-path:polygon(2% 0,98% 4%,100% 50%,97% 100%,3% 96%,0 50%)}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;min-height:36px}
.sh-head h2{font-size:18px;margin:0;font-weight:800}
.x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card-2);color:var(--sub);flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.x svg{width:15px;height:15px;stroke-width:2.4}

/* 编辑器 */
.word-line{display:flex;align-items:center;gap:10px}
.big-word{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:38px;font-weight:900;letter-spacing:-.01em;padding:2px 0}
.big-word::placeholder{color:var(--faint);font-weight:700}
.big-word:focus-visible{outline:none}
.lookup{flex:none;display:flex;align-items:center;gap:6px;height:38px;padding:0 15px 0 12px;border-radius:19px;background:var(--ink);color:var(--ink-text);font-size:13px;font-weight:800}
.lookup svg{width:16px;height:16px}
.lookup:disabled{opacity:.25}
.status{font-size:13px;color:var(--sub);min-height:20px;margin:4px 0 2px;display:flex;align-items:center;gap:6px;font-weight:600}
.status.warn{color:var(--warn)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--faint);border-top-color:var(--text);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lbl{display:block;font-size:13px;font-weight:800;color:var(--sub);margin:16px 4px 8px}
.field{display:block;width:100%;padding:12px 15px;border-radius:15px;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line);border:0;outline:none;font-size:16px;font-weight:600;resize:none}
.field::placeholder{color:var(--faint);font-weight:500}
textarea.field{line-height:1.5}
.field.ex{font-style:italic}
.field.small{font-size:14px;color:var(--sub);font-weight:500}
.sense{padding:14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);margin-top:12px;animation:pop .45s var(--ease) both}
.s-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.s-no{font-family:var(--hand);font-size:22px;color:var(--faint);flex:none;width:16px;line-height:1}
.s-rm{margin-left:auto;width:28px!important;height:28px!important}
.pos-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:1px}
.pos-row::-webkit-scrollbar{display:none}
.pchip{flex:none;font-size:13px;font-weight:800;padding:0 11px;height:28px;border-radius:14px;color:var(--sub);box-shadow:inset 0 0 0 1.5px var(--line);transition:background .2s,color .2s,transform .3s var(--spring)}
.pchip:active{transform:scale(.92)}
.pchip.on{background:var(--ink);color:var(--ink-text);box-shadow:none}
.gap{height:8px}
.add-sense{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:46px;margin-top:12px;border-radius:23px;border:1.5px dashed var(--faint);color:var(--sub);font-size:14px;font-weight:700;transition:background .2s}
.add-sense:active{background:var(--card-2)}
.add-sense svg{width:16px;height:16px}
.sheet .chips{padding:2px 22px 6px;margin:0 -22px}
.save{display:block;text-align:center;margin-top:20px;height:54px;border-radius:27px;font-weight:800;font-size:16px;width:100%;background:var(--ink);color:var(--ink-text);transition:opacity .2s,transform .34s var(--spring)}
.save:active{transform:scale(.975)}
.save:disabled{opacity:.25}
.danger{display:block;text-align:center;width:100%;margin-top:10px;height:46px;border-radius:23px;color:var(--warn);font-weight:700;font-size:15px}
.danger:active{background:var(--card-2)}

/* 单词卡 */
.d-word{font-size:clamp(40px,12vw,52px);font-weight:900;letter-spacing:-.02em;line-height:1.05;word-break:break-word}
.d-word span{display:inline-block;white-space:pre}
.sheet.on .d-word span{animation:letterIn .7s var(--ease) both;animation-delay:calc(var(--i)*30ms + 120ms)}
@keyframes letterIn{from{opacity:0;transform:translateY(14px) scale(.9);filter:blur(6px)}}
.d-phon-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.d-phon{font-size:16px;color:var(--sub);font-weight:600}
.speak{width:40px;height:40px;transition:transform .32s var(--spring)}
.speak:active{transform:scale(.9)}
.speak svg{width:18px;height:18px}
.speak.playing svg{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.d-senses{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.d-sense{padding:14px 16px;border-radius:18px;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line)}
.d-sense .head{display:flex;align-items:baseline;gap:10px}
.d-pos{flex:none;font-size:12px;font-weight:900;padding:2px 9px;border-radius:10px;background:var(--ink);color:var(--ink-text)}
.d-mean{font-size:17px;font-weight:700;line-height:1.45;min-width:0}
.d-def{font-size:13px;color:var(--sub);line-height:1.5;margin-top:6px;font-weight:500}
.d-ex{margin-top:8px;font-size:15px;font-style:italic;line-height:1.55;padding-left:12px;border-left:2px solid var(--faint);font-weight:500}
.d-ex mark{background:linear-gradient(transparent 55%,var(--mark) 55%);color:inherit;font-weight:800;padding:0 1px}
.d-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:var(--sub)}
.d-foot .hand{font-size:20px}
.d-foot .chip{height:28px;font-size:12px;padding:0 12px;background:var(--card-2)}
.d-actions{display:flex;gap:10px;margin-top:16px}
.d-actions button{height:50px;border-radius:25px;font-weight:800;font-size:15px;text-align:center}
.d-actions .edit{flex:1;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line)}
.d-actions .mk{width:50px;display:grid;place-items:center;background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line);color:var(--sub)}
.d-actions .mk svg{width:19px;height:19px}
.d-actions .mk.on{color:var(--text)}
.d-actions .mk.on svg{fill:currentColor}
.d-actions .del{padding:0 18px;color:var(--warn);background:var(--card-2);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s,color .2s}
.d-actions .del.confirm{background:var(--warn);color:#fff;box-shadow:none}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:50;transform:translate(-50%,-16px);opacity:0;
  display:flex;align-items:center;gap:8px;padding:10px 18px 10px 14px;border-radius:22px;background:var(--card);box-shadow:var(--shadow),0 10px 24px rgba(0,0,0,.1);
  font-size:14px;font-weight:700;color:var(--text);pointer-events:none;white-space:nowrap;transition:opacity .3s var(--ease),transform .42s var(--ease)}
.toast svg{width:16px;height:16px;stroke-width:2.4}
.toast.on{opacity:1;transform:translate(-50%,0)}

#printArea{display:none}
@page{size:A5;margin:0}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  :root{padding:0}
  .bg,#app,.tabbar,.scrim,.sheet,.toast,.print-go{display:none!important}
  #printArea{display:block}
  #printArea .a5{break-after:page;page-break-after:always}
  #printArea .a5:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion: reduce){
  .grid-paper,.glow,.mascot .blob,.mascot svg.cat,.mascot .eyes,.bubble{animation:none}
  .steam path{animation:none;opacity:.7}
  .shift{transition:none}
  .page{transition:opacity .2s ease-out}
  .page.in,.page.out{transform:none;filter:none}
  .sheet{transform:none;transition:opacity .2s,visibility 0s linear .2s}
  .sheet.on{transition:opacity .2s,visibility 0s}
  .wgrid.stagger .wcard,.sheet.on .d-word span,.sense{animation:none}
  .press:active,.save:active,.chip:active,.pchip:active,.send:active{transform:none}
  .speak.playing svg{animation:none}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="shift" id="bgShift">
    <div class="grid-paper"></div>
    <i class="glow g1"></i><i class="glow g2"></i><i class="glow g3"></i>
  </div>
</div>

<div id="app">
  <!-- 首页 -->
  <section class="page show" id="p-home">
    <div class="top">
      <span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 3v4M17 5h4"/></svg>拾词 · Words</span>
      <button class="round-btn press" id="goSearch" aria-label="搜索单词"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button>
    </div>
    <div class="mascot" aria-hidden="true">
      <div class="blob"></div>
      <svg class="cat" viewBox="0 0 200 220">
        <defs>
          <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ececed"/><stop offset="1" stop-color="#cfcfd1"/></linearGradient>
          <linearGradient id="brew" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9c9c9e"/><stop offset="1" stop-color="#7c7c7f"/></linearGradient>
        </defs>
        <g class="steam" fill="none" stroke="#c6c6c8" stroke-width="5" stroke-linecap="round">
          <path d="M78 70 q-8 -10 0 -20 q8 -10 0 -22"/>
          <path d="M100 66 q-8 -11 0 -22 q8 -11 0 -24"/>
          <path d="M122 70 q-8 -10 0 -20 q8 -10 0 -22"/>
        </g>
        <ellipse cx="100" cy="200" rx="80" ry="12" fill="#d4d4d6"/>
        <ellipse cx="100" cy="197" rx="58" ry="7" fill="#e6e6e7"/>
        <path d="M152 112 C186 108 188 156 146 160" fill="none" stroke="url(#fur)" stroke-width="13" stroke-linecap="round"/>
        <path d="M42 96 L158 96 Q157 172 130 188 Q100 200 70 188 Q43 172 42 96 Z" fill="url(#fur)"/>
        <ellipse cx="100" cy="96" rx="58" ry="14" fill="#f6f6f7" stroke="#d3d3d5" stroke-width="2"/>
        <ellipse cx="100" cy="98" rx="49" ry="9.5" fill="url(#brew)"/>
        <path d="M100 103 c-5 -3 -9 -5 -9 -8 a4 4 0 0 1 9 -1 a4 4 0 0 1 9 1 c0 3 -4 5 -9 8z" fill="#e9e9ea" opacity=".9"/>
        <g class="eyes" fill="#3e3e40"><circle cx="82" cy="136" r="4.6"/><circle cx="118" cy="136" r="4.6"/></g>
        <ellipse cx="70" cy="149" rx="8" ry="4" fill="#fff" opacity=".45"/><ellipse cx="130" cy="149" rx="8" ry="4" fill="#fff" opacity=".45"/>
        <path d="M93 146 q7 6.5 14 0" fill="none" stroke="#3e3e40" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      <div class="bubble"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></div>
    </div>
    <div class="greet">
      <h2 id="greetH">今天想拾几个新词？</h2>
      <p class="hand">one sip, one word ♡</p>
    </div>

    <div class="card quick">
      <div class="quick-head">快速记一个词<span id="quickHint">会自动帮你查</span></div>
      <form class="msg" id="quickForm">
        <input id="quickIn" placeholder="输入一个英文单词…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="单词">
        <button class="send" id="quickGo" type="submit" disabled aria-label="记下来"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
      </form>
    </div>

    <div class="tiles">
      <button class="card tile press" data-go="add"><svg class="i" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15H5.5A1.5 1.5 0 0 1 4 17.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v15h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg><b>记单词</b><small>Write it down</small></button>
      <button class="card tile press" data-go="1"><svg class="i" viewBox="0 0 24 24"><path d="M5 4v16M9 4v16"/><path d="m13 5 4-1 3 15.5-4 1z"/></svg><b>书架</b><small>All my words</small></button>
      <button class="card tile press" data-go="2"><svg class="i" viewBox="0 0 24 24"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="8" rx="2.5"/><path d="M7 14h10v6H7z"/></svg><b>打印</b><small>A5 sheets</small></button>
    </div>

    <div class="stickers">
      <div class="card note" id="noteCard">
        <svg class="clip" viewBox="0 0 36 24"><rect x="6" y="6" width="24" height="16" rx="4" fill="currentColor"/><rect x="12" y="1" width="12" height="9" rx="4" fill="none" stroke="currentColor" stroke-width="3"/></svg>
        <div class="lab">still remember?</div>
        <div class="nw" id="noteW">—</div>
        <button class="nm blur" id="noteM">点一下看意思</button>
        <div class="lines"></div>
      </div>
      <div class="card ring-card">
        <div class="lab">连续拾词</div>
        <div class="ring"><svg viewBox="0 0 100 100"><circle class="t" cx="50" cy="50" r="40"/><circle class="p" id="ringP" cx="50" cy="50" r="40" style="stroke-dasharray:0 252"/></svg>
          <div class="n"><span id="streakN">0</span><small>days</small></div></div>
        <div class="week" id="week"></div>
        <span class="hand" id="streakMsg">keep going ♡</span>
      </div>
    </div>

    <div class="sec">最近拾到<span id="recentMore"></span></div>
    <div class="card recent" id="recent"></div>
  </section>

  <!-- 书架 -->
  <section class="page" id="p-shelf">
    <div class="top">
      <div>
        <h1 class="h-title">我的书架</h1>
        <div class="h-sub">Words I picked up, every day.</div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="round-btn press" id="toggleSearch" aria-label="搜索"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button>
        <button class="round-btn dark press" id="shelfAdd" aria-label="记一个单词"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
    </div>
    <label class="card search" id="searchBox" hidden>
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="searchIn" placeholder="搜单词或中文意思" autocomplete="off" autocapitalize="off" spellcheck="false">
    </label>
    <div class="chips" id="bookChips" style="margin-top:12px"></div>
    <div class="book-bar">
      <span class="info" id="bookInfo"></span>
      <div class="seg" id="sortSeg" style="width:120px"><span class="knob"></span><button data-s="new" class="on">最新</button><button data-s="az">A–Z</button></div>
    </div>
    <div id="shelfBody"></div>
  </section>

  <!-- 打印 -->
  <section class="page" id="p-print">
    <h1 class="h-title">打印单词表</h1>
    <div class="h-sub">A5 · 一行 5 个 · 二刷时在方框里打勾</div>
    <div class="chips" id="printChips" style="margin-top:14px"></div>
    <div class="pv-opts">
      <span class="info" id="pvInfo"></span>
      <div class="seg" id="pvSort" style="width:150px"><span class="knob"></span><button data-s="add" class="on">添加顺序</button><button data-s="az">A–Z</button></div>
    </div>
    <div class="pv-pages" id="pvPages"></div>
  </section>
</div>

<button class="save print-go off" id="printGo">打印 / 存成 PDF</button>

<nav class="tabbar" id="tabbar">
  <span class="hl" aria-hidden="true"></span>
  <button class="tab on" data-t="0"><svg class="i" viewBox="0 0 24 24"><path class="fill" d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg>首页</button>
  <button class="tab" data-t="1"><svg class="i" viewBox="0 0 24 24"><path class="fill" d="M4.5 4h4v16h-4zM10 4h4v16h-4z"/><path class="fill" d="m15.5 5.2 3.7-1 3 15-3.7 1z"/></svg>书架</button>
  <button class="tab" data-t="2"><svg class="i" viewBox="0 0 24 24"><path d="M7 9V4h10v5"/><rect class="fill" x="4" y="9" width="16" height="8" rx="2.5"/><path d="M7 14h10v6H7z" fill="var(--card)"/></svg>打印</button>
</nav>

<div class="scrim" id="scrim"></div>

<!-- 记单词 / 编辑 -->
<div class="sheet" id="wordSheet" role="dialog" aria-label="记一个单词">
  <div class="grab"></div>
  <div class="sh-head">
    <h2 id="wsTitle">记一个单词</h2>
    <button class="x" data-close aria-label="关闭"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="word-line">
    <input class="big-word" id="fWord" placeholder="word" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="单词">
    <button class="lookup" id="fLookup" disabled><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>查词</button>
  </div>
  <div class="status" id="fStatus"></div>
  <label class="lbl" for="fPhon">音标</label>
  <input class="field" id="fPhon" placeholder="查词后会自动填上，也可以自己写" autocomplete="off" autocapitalize="off" spellcheck="false">
  <span class="lbl">词性 · 意思 · 造句</span>
  <div id="fSenses"></div>
  <button class="add-sense" id="fAddSense"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>再加一个意思</button>
  <span class="lbl">放进哪本书</span>
  <div class="chips" id="fBooks"></div>
  <button class="save" id="fSave" disabled>保存</button>
</div>

<!-- 单词卡 -->
<div class="sheet" id="detailSheet" role="dialog" aria-label="单词卡">
  <div class="tape" aria-hidden="true"></div>
  <div class="sh-head">
    <span class="chip" id="dBook" style="height:28px;font-size:12px;padding:0 12px;display:inline-flex;align-items:center;background:var(--card-2)"></span>
    <button class="x" data-close aria-label="关闭"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="d-word" id="dWord"></div>
  <div class="d-phon-row">
    <button class="well speak" id="dSpeak" aria-label="听发音"><svg class="i" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
    <span class="d-phon" id="dPhon"></span>
  </div>
  <div class="d-senses" id="dSenses"></div>
  <div class="d-foot"><span class="hand" id="dMeta"></span></div>
  <div class="d-actions">
    <button class="edit" id="dEdit">编辑</button>
    <button class="mk" id="dMark" aria-label="收藏"><svg class="i" viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg></button>
    <button class="del" id="dDel">删除</button>
  </div>
</div>

<!-- 书 -->
<div class="sheet" id="bookSheet" role="dialog" aria-label="书">
  <div class="grab"></div>
  <div class="sh-head">
    <h2 id="bsTitle">加一本书</h2>
    <button class="x" data-close aria-label="关闭"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <label class="lbl" for="bName" style="margin-top:4px">书名</label>
  <input class="field" id="bName" placeholder="比如：六级词汇、新概念 3、经济学人精读" maxlength="24" autocomplete="off">
  <button class="save" id="bSave" disabled>保存</button>
  <button class="danger" id="bDel" hidden>删除这本书</button>
</div>

<div id="printArea"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const mq = matchMedia('(prefers-reduced-motion: reduce)');
  let RM = mq.matches;
  mq.addEventListener && mq.addEventListener('change', e => RM = e.matches);

  const POS = ['n.','v.','adj.','adv.','prep.','conj.','pron.','phr.','int.'];
  const POS_MAP = {noun:'n.',verb:'v.',adjective:'adj.',adverb:'adv.',preposition:'prep.',conjunction:'conj.',pronoun:'pron.',interjection:'int.',phrase:'phr.',determiner:'det.',exclamation:'int.'};
  const MARK_ID = '__marked';

  // ---------- 本地存储 ----------
  const KEY = 'shici-words-v1';
  let storageOk = true;
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function load(){
    try{
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.groups) && Array.isArray(s.words)) return s;
    }catch(e){ storageOk = false; }
    return {groups:[], words:[], sort:'new'};
  }
  const S = load();
  S.words.forEach(w => {
    if (!Array.isArray(w.senses)){
      w.senses = [{pos:'', mean:w.meaning || '', def:'', examples: w.example ? [w.example] : []}];

    if (hit){
      const [, [phon, tr]] = hit;
      if (phon && !fPhon.value.trim()) fPhon.value = fixPhon(phon);
      if (draftIsEmpty()){ draft = localSenses(tr); renderSenses(); filled = true; }
      setStatus(filled ? '查到啦，中文意思已经帮你填好，可以再改改' : '查到了音标。你已经写了意思，就没有覆盖');
    }
    // 联网补充：英文例句 + 真人发音（连不上也没关系）
    if (!navigator.onLine){ if (!hit) setStatus('词典里没找到这个词，可以自己填'); return; }
    const data = await onlineExtra(w);
    if (seq !== lookSeq) return;
    if (!data || !Array.isArray(data)){ if (!hit) setStatus('词典里没找到这个词，可以自己填'); return; }
    const phs = data.flatMap(d => d.phonetics || []);
    const au = phs.map(p => p.audio).filter(Boolean);
    audioUrl = au.find(a => /-us\.mp3$/.test(a)) || au.find(a => /-uk\.mp3$/.test(a)) || au[0] || audioUrl;
    const byPos = new Map();
    data.forEach(d => (d.meanings || []).forEach(m => {
      const p = POS_MAP[m.partOfSpeech] || m.partOfSpeech || '';
      if (!byPos.has(p)) byPos.set(p, []);
      byPos.get(p).push(...(m.definitions || []));
    }));
    if (!hit){
      const phon = (data.find(d => d.phonetic) || {}).phonetic || (phs.find(p => p.text) || {}).text || '';
      if (phon && !fPhon.value.trim()) fPhon.value = phon;
      const found = [...byPos.entries()].slice(0, 4).map(([pos, defs]) => {
        const first = defs[0] || {}; const ex = first.example || (defs.find(d => d.example) || {}).example;
        return {pos, mean:'', def:first.definition || '', examples: ex ? [ex] : []};
      });
      if (found.length && draftIsEmpty()){ draft = found; renderSenses(); setStatus('查到了英文释义和例句，补上中文意思就行'); }
      else setStatus('词典里没找到这个词，可以自己填');
      return;
    }
    if (!filled) return;
    // 把英文释义和例句挂到对应词性上
    let added = 0;
    draft.forEach(s => {
      const defs = byPos.get(s.pos);
      if (!defs || !defs.length) return;
      const ex = (defs.find(d => d.example) || {}).example;
      if (!s.def) s.def = defs[0].definition || '';
      if (ex && !s.examples.length){ s.examples = [ex]; added++; }
    });
    if (draftIsEmpty() === false){ renderSenses(); }
    setStatus(added ? '查到啦，中文意思和例句都帮你填好了' : '查到啦，中文意思已经帮你填好，可以再改改');
  }
  function openWordSheet(id, preset){
    editingId = id; lookedUp = ''; clearTimeout(lookTimer); lookSeq++;
    const w = id ? S.words.find(x => x.id === id) : null;
    $('#wsTitle').textContent = w ? '编辑单词' : '记一个单词';
    fWord.value = w ? w.word : (preset || '');
    fPhon.value = w ? w.phon || '' : '';
    audioUrl = w ? w.audio || '' : '';
    draft = w ? w.senses.map(s => ({...s, examples:[...s.examples]})) : [emptySense()];
    if (!draft.length) draft = [emptySense()];
    const ctxBook = cur === 1 && shelfBook && shelfBook !== MARK_ID ? shelfBook : null;
    pickBook = w ? w.groupId : (ctxBook || (pickBook && bookOf(pickBook) ? pickBook : S.groups[0].id));
    setStatus(w ? '' : '输入单词，会自动帮你查音标、词性和中文意思');
    renderSenses(); renderBookChips(); checkWord();
    openSheet($('#wordSheet'), preset ? null : fWord);
    if (preset && !w) lookup(true);
  }
  function saveWord(){
    const word = fWord.value.trim(); if (!word) return;
    if (!bookOf(pickBook)) pickBook = S.groups[0].id;
    const senses = draft.map(s => ({pos:s.pos, mean:s.mean.trim(), def:s.def.trim(), examples:s.examples.map(x => x.trim()).filter(Boolean)}))
      .filter(s => s.pos || s.mean || s.def || s.examples.length);
    const data = {word, phon:fPhon.value.trim(), audio:audioUrl, senses: senses.length ? senses : [emptySense()], groupId:pickBook};
    const isEdit = !!editingId;
    if (isEdit) Object.assign(S.words.find(x => x.id === editingId), data);
    else S.words.push({id:uid(), created:Date.now(), star:false, ...data});
    persist(); closeSheet();
    setTimeout(refresh, RM ? 0 : 160);
    toast(isEdit ? '已更新' : `已放进「${bookOf(pickBook).name}」`);
  }
  fSave.addEventListener('click', saveWord);

  // ---------- 单词卡 ----------
  let detailId = null, delT, player = null;
  const canSpeak = 'speechSynthesis' in window;
  function highlight(ex, word){
    const safe = esc(ex);
    const base = word.trim().toLowerCase().replace(/(ies|es|e|y|s)$/,'');
    if (base.length < 2) return safe;
    const re = new RegExp('\\b(' + base.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '[a-z]*)', 'gi');
    return safe.replace(re, '<mark>$1</mark>');
  }
  function renderMark(w){ $('#dMark').classList.toggle('on', !!w.star); $('#dMark').setAttribute('aria-pressed', !!w.star); }
  function openDetail(id){
    const w = S.words.find(x => x.id === id); if (!w) return;
    detailId = id;
    $('#dWord').innerHTML = [...w.word].map((c, i) => `<span style="--i:${Math.min(i, 18)}">${esc(c)}</span>`).join('');
    $('#dPhon').textContent = w.phon || '';
    $('#dSpeak').hidden = !w.audio && !canSpeak;
    const ss = w.senses.filter(s => s.pos || s.mean || s.def || s.examples.length);
    $('#dSenses').innerHTML = ss.length ? ss.map(s => `
      <div class="d-sense">
        <div class="head">${s.pos ? `<span class="d-pos">${esc(s.pos)}</span>` : ''}<div class="d-mean">${s.mean ? esc(s.mean) : '<span style="color:var(--faint)">还没写中文意思</span>'}</div></div>
        ${s.def ? `<div class="d-def">${esc(s.def)}</div>` : ''}
        ${s.examples.map(x => `<div class="d-ex">${highlight(x, w.word)}</div>`).join('')}
      </div>`).join('') : '<div style="color:var(--sub);font-size:14px">还没写意思，点「编辑」补上吧</div>';
    const b = bookOf(w.groupId);
    $('#dBook').textContent = b ? b.name : '';
    const d = new Date(w.created);
    $('#dMeta').textContent = `picked up on ${d.getMonth()+1}/${d.getDate()} ♡`;
    renderMark(w); resetDel();
    openSheet($('#detailSheet'));
  }
  function stopAudio(){
    if (player){ player.pause(); player = null; }
    if (canSpeak) speechSynthesis.cancel();
    $('#dSpeak').classList.remove('playing');
  }
  function speakTTS(word){
    if (!canSpeak) return $('#dSpeak').classList.remove('playing');
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US'; u.rate = .85;
    const vs = speechSynthesis.getVoices();
    const v = vs.find(x => /^en[-_]US/i.test(x.lang)) || vs.find(x => /^en/i.test(x.lang));
    if (v) u.voice = v;
    u.onend = u.onerror = () => $('#dSpeak').classList.remove('playing');
    speechSynthesis.speak(u);
  }
  $('#dSpeak').addEventListener('click', () => {
    const w = S.words.find(x => x.id === detailId); if (!w) return;
    stopAudio(); $('#dSpeak').classList.add('playing');
    if (w.audio && navigator.onLine){
      player = new Audio(w.audio);
      player.onended = () => $('#dSpeak').classList.remove('playing');
      player.onerror = () => { player = null; speakTTS(w.word); };
      player.play().catch(() => { player = null; speakTTS(w.word); });
    } else speakTTS(w.word);
  });
  $('#dEdit').addEventListener('click', () => openWordSheet(detailId));
  $('#dMark').addEventListener('click', () => { toggleStar(detailId); const w = S.words.find(x => x.id === detailId); if (w) renderMark(w); });
  function resetDel(){ clearTimeout(delT); const b = $('#dDel'); b.classList.remove('confirm'); b.textContent = '删除'; }
  $('#dDel').addEventListener('click', () => {
    const b = $('#dDel');
    if (!b.classList.contains('confirm')){ b.classList.add('confirm'); b.textContent = '确认删除'; delT = setTimeout(resetDel, 3000); return; }
    S.words = S.words.filter(x => x.id !== detailId);
    persist(); closeSheet();
    setTimeout(refresh, RM ? 0 : 160);
    toast('已删除');
  });

  // ---------- 书 ----------
  const bName = $('#bName'), bSave = $('#bSave'), bDel = $('#bDel');
  let editBookId = null, returnToWord = false, bDelT;
  function openBookSheet(gid, fromWord){
    editBookId = gid; returnToWord = !!fromWord;
    const g = gid ? bookOf(gid) : null;
    $('#bsTitle').textContent = g ? '编辑这本书' : '加一本书';
    bName.value = g ? g.name : '';
    bSave.disabled = !bName.value.trim();
    bDel.hidden = !g; resetBDel();
    openSheet($('#bookSheet'), bName);
  }
  bName.addEventListener('input', () => bSave.disabled = !bName.value.trim());
  bName.addEventListener('keydown', e => { if (e.key === 'Enter' && !bSave.disabled) saveBook(); });
  function saveBook(){
    const name = bName.value.trim(); if (!name) return;
    if (editBookId) bookOf(editBookId).name = name;
    else {
      const g = {id:uid(), name, created:Date.now()};
      S.groups.push(g);
      if (returnToWord) pickBook = g.id; else if (cur === 1) shelfBook = g.id;
    }
    persist(); refresh();
    if (returnToWord){ renderBookChips(); openSheet($('#wordSheet')); }
    else { closeSheet(); toast(editBookId ? '已改名' : '加好啦'); }
  }
  bSave.addEventListener('click', saveBook);
  function resetBDel(){ clearTimeout(bDelT); bDel.textContent = '删除这本书'; bDel.dataset.c = ''; }
  bDel.addEventListener('click', () => {
    const n = wordsIn(editBookId).length;
    if (!bDel.dataset.c){
      bDel.dataset.c = '1';
      bDel.textContent = n ? `书里的 ${n} 个词也会删掉，再点一次确认` : '再点一次确认删除';
      bDelT = setTimeout(resetBDel, 3500); return;
    }
    S.words = S.words.filter(w => w.groupId !== editBookId);
    S.groups = S.groups.filter(g => g.id !== editBookId);
    if (!S.groups.length) S.groups.push({id:uid(), name:'我的生词', created:Date.now()});
    if (shelfBook === editBookId) shelfBook = null;
    persist(); closeSheet(); refresh(); toast('已删除');
  });

  renderHome();
  persist();

  if ('serviceWorker' in navigator && location.protocol === 'https:' && /github\.io$/.test(location.hostname)){
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();
</script>
